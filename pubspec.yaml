name: aqoong_homepage
description: AQoong.dev Flutter web homepage with developer package cards and a JSON online parser.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  firebase_analytics: ^12.4.2
  firebase_core: ^4.10.0
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  qr_flutter: ^4.1.0
  size_tailored_text: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
